# The manifest of this rule set (docs/CONTRACT.md).
name = "rusty-bidding-bot"
description = "The base system and conventions, switched on by the convention card"
# The rule language version these files are written in: an engine that
# reads another version refuses to load them.
language = 1
# The engine version they were developed against (information only):
# 0.2.0 is the first that reads the modules' `skill` header lines, 0.3.0
# the first with `define` and the judgment layer's Phase 0 terms, 0.4.0
# the first with `force game`, 0.5.0 the first with `define auction` and
# `systems on`, 0.7.0 (unreleased) the first with `artificial_contract`,
# 0.11.0 the first with the `step(n)` call (modified-jacoby-2nt.bid),
# 0.11.1 the first with `partner.unread` (base.bid's fallback), 0.13.0
# the first with the modules' `kind` line.
engine = "0.13.0"
