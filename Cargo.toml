[workspace]
resolver = "2"
members = [
    "crates/bridge-card",
    "crates/bidspec",
    "crates/engine",
    "crates/assets",
    "crates/compare",
    "crates/cli",
    "crates/workbench",
    "crates/wasm",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bridge-craftwork/rusty-bidding-bot"

[workspace.dependencies]
bridge-types = { git = "https://github.com/bridge-craftwork/bridge-types", features = ["serde"] }
bridge-card = { path = "crates/bridge-card" }
bidspec = { path = "crates/bidspec" }
rbb-engine = { path = "crates/engine" }
rbb-compare = { path = "crates/compare" }
rbb-assets = { path = "crates/assets" }
