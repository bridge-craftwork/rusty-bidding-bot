[workspace]
resolver = "2"
members = [
    "crates/bidspec",
    "crates/engine",
    "crates/assets",
    "crates/compare",
    "crates/cli",
    "crates/workbench",
    "crates/wasm",
]

[workspace.package]
version = "0.15.3"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bridge-craftwork/rusty-bidding-bot"

[workspace.dependencies]
bridge-types = { git = "https://github.com/bridge-craftwork/bridge-types", features = ["serde"] }
# The pack reader, on convention-card's pack/reader branch until it is tagged.
bridge-card = { git = "https://github.com/bridge-craftwork/convention-card", rev = "1a286350ce9d94372f42f542e55ea168ede6588a" }
bidspec = { path = "crates/bidspec" }
rbb-engine = { path = "crates/engine" }
rbb-compare = { path = "crates/compare" }
rbb-assets = { path = "crates/assets" }
