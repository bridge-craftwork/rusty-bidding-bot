# ── Judgment ──────────────────────────────────────────────────────────
# measure.class: compare's par classes (ours against BBA's count; good
# when ours is no more than BBA's, fair up to 25% more, poor beyond).
[[judgment]]
id = "judgment/slam_entry"
name = "Slam entry and valuation"
level = 6
summary = "Whether to try for slam at all, and how: the judgment layer's slam entry, before any ask (docs/JUDGMENT-LAYER.md)."
modules = ["slam-entry", "slam-catch", "over-3nt"]
measure = { class = ["short_of_slam"] }

[[judgment]]
id = "judgment/game_and_level"
name = "Game and partscore placement"
level = 3
summary = "Bidding game when it makes and stopping short when it does not."
modules = ["base", "fit", "choice-of-games"]
measure = { class = ["short_of_game", "short_level", "overbid"] }

[[judgment]]
id = "judgment/strain"
name = "Strain: fit against agreement"
level = 4
summary = "Finding the right strain and declarer: a publicly agreed suit against a fit only one hand can see."
modules = ["fit", "choice-of-games"]
measure = { class = ["wrong_strain"] }

[[judgment]]
id = "judgment/competition"
name = "Competitive judgment (LoTT)"
level = 4
summary = "Whether to compete, sacrifice or let them play, by total tricks (total-tricks.bid)."
modules = ["total-tricks"]
measure = { class = ["did_not_compete", "no_sacrifice"] }

[[judgment]]
id = "judgment/penalty_doubles"
name = "Penalty doubles"
level = 4
summary = "Doubling them when they are too high, and not doubling contracts that make."
modules = ["penalty-doubles"]
measure = { class = ["doubling_only"] }

[[judgment]]
id = "judgment/game_force"
name = "Game-force state"
level = 4
summary = "Tracking who has forced to game and never passing below it (`force game`, base.bid)."
modules = ["game-force", "base"]
measure = { class = ["passed_out"] }

[[judgment]]
id = "judgment/systems_on"
name = "Systems on"
level = 5
summary = "One notrump system for every natural notrump: after an overcall, a balancing 1NT, a 2NT rebid (engine 0.5.0)."
modules = ["notrump-base", "nt-interference"]
scenarios = ["We_Overcall_NT_then_Stayman", "We_Overcall_NT_then_Jacoby", "We_Overcall_NT_then_Texas", "We_Overcall_NT_then_Smolen"]

[[judgment]]
id = "judgment/opening"
name = "Opening judgment"
level = 2
summary = "Whether to open, and what: the 12 total points rule, third and fourth seat, the rule of 15."
modules = ["base"]
scenarios = ["Basic_What_To_Open", "Open_In_Fourth_Seat", "Rule_of_16"]

# ── Catch-alls ────────────────────────────────────────────────────────
# measure.no_rule: our calls no rule explains, per 1,000 boards (good
# under 1, fair under 5). measure.read_as: our calls partner reads by a
# higher rule than chose them, per 1,000 boards (same thresholds).
[[catchall]]
id = "catchall/no_rule"
name = "Positions with no rule"
level = 1
summary = "Calls the engine made with no rule to say why: gaps in the system."
measure = { no_rule = true }

[[catchall]]
id = "catchall/read_as_higher"
name = "Calls read as a higher rule"
level = 1
summary = "Our calls partner reads by a higher-priority rule than the one that bid them (docs/JUDGMENT-LAYER.md §4)."
measure = { read_as = true }

[[catchall]]
id = "catchall/game_reached"
name = "Game reached: pass"
level = 1
summary = "Once our side has bid game, a player with nothing more to add passes (base.bid)."
modules = ["base"]

[[catchall]]
id = "catchall/defending_side"
name = "Defending side: nothing more to say"
level = 1
summary = "The defending side passes once both have described their hands (advances.bid, below every real rule)."
modules = ["advances"]

[[catchall]]
id = "catchall/after_interference"
name = "Opening side after a pass"
level = 1
summary = "A player on the opening side who passed last time passes again with nothing new (after-interference.bid)."
modules = ["after-interference"]

[[catchall]]
id = "catchall/notrump_rebid"
name = "After partner's notrump rebid"
level = 2
summary = "Responder's catch-all after opener's notrump rebid (responder-rebids.bid, Rick 2026-09-27)."
modules = ["responder-rebids"]
