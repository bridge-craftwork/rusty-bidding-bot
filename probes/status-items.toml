# The status page's curated half (web/status.html, docs/WEB.md "Status
# page"). probes/tools/status_data.py reads it beside convention-card's
# spec (at the pinned revision), the modules (`rbb bid skills --json`),
# a full `compare --json` and the self A/B results.
#
# What lives here, because the spec does not say it:
#   [groups]      conventions shown as treatments of another's tile
#                 (Reverse Drury under Drury); the child's own fields
#                 become chips on the parent tile
#   [items.<id>]  per tile: `scenarios` (PBS scenarios that measure it
#                 against BBA), `partial` (what is not written yet, one
#                 line), `treatments` (extra chips for treatments the
#                 pinned card has no field for: { label, status, note }),
#                 `fields` (extra card fields to show, e.g. an untagged
#                 field the rules read), `modules` (extra modules)
#   [[basic]]     basic-bridge tiles beyond the spec's basic_bidding
#   [[judgment]]  judgment tiles (not conventions: docs/JUDGMENT-LAYER.md)
#   [[catchall]]  the fallback rules
#
# Judgment and catch-all tiles carry a `measure`: a par class from
# compare's "how each table met par" (ours against BBA's count), or
# `no_rule` / `read_as` (our counts per 1,000 boards).

[groups]
"bidding_conventions/drury" = ["bidding_conventions/reverse_drury", "bidding_conventions/two_way_drury"]
"bidding_conventions/bergen_raises" = ["bidding_conventions/reverse_bergen_raises"]
"bidding_conventions/jacoby_2nt" = ["bidding_conventions/modified_jacoby_2nt", "bidding_conventions/jacoby_2nt_splinters"]
"bidding_conventions/new_minor_forcing" = ["bidding_conventions/two_way_nmf"]
"bidding_conventions/roman_keycard" = ["bidding_conventions/six_key_rkcb"]
"bidding_conventions/help_suit_game_try" = ["bidding_conventions/two_way_game_tries"]
"bidding_conventions/walsh" = ["bidding_conventions/transfer_walsh"]
"bidding_conventions/forcing_1nt" = ["bidding_conventions/semi_forcing_1nt"]
"bidding_conventions/flannery" = ["bidding_conventions/reverse_flannery"]
"bidding_conventions/dopi_ropi" = ["bidding_conventions/depo"]
"bidding_conventions/stayman" = ["bidding_conventions/range_stayman"]
"bidding_conventions/multi_2d" = ["bidding_conventions/lars_multi"]
"competitive_bidding/michaels_unusual" = ["competitive_bidding/leaping_michaels", "competitive_bidding/non_leaping_michaels"]
