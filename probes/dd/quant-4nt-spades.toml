# 1NT (P) 2H (P) 2S (P) 4NT (P): opener's answer to the quantitative 4NT
# with five spades (jacoby-transfers.bid, `when asked quant_major`).
# Pass (4NT), 5S, 6S or 6NT: the spade twin of quant-4nt-hearts.toml.
# Run: probes/tools/dd_auction_test.py probes/dd/quant-4nt-spades.toml
name = "quant-4nt-spades"
# North opens 1NT (15-17 balanced, no five-card major: the 21GF card),
# South has five spades in a 5-3-3-2 and 16-17 total points (the 4NT
# band: strength=slam_invite opposite 15-17).
dealer = "hcp(north) >= 15 && hcp(north) <= 17 && shape(north, any 4333 + any 4432 + any 5332 - 5xxx - x5xx) && spades(south) == 5 && shape(south, any 5332) && hcp(south) >= 13 && hcp(south) <= 16"
north = "15 <= h <= 17 and nt and L[0] <= 4 and L[1] <= 4"
south = "L[0] == 5 and nt and 16 <= pts <= 17"
contracts = ["4NT N", "5S N", "6S N", "6NT N"]
baseline = "4NT N"
vuls = ["None", "Both"]
quota = 2000
batch = 6000
max_batches = 300
split = ["N.h"]

[[class]]
label = "4333, 3 spades"
expr = "N.dist == [4,3,3,3] and N.L[0] == 3"
dealer = "shape(north, 3433 + 3343 + 3334)"

[[class]]
label = "4333, 4 spades"
expr = "N.L == [4,3,3,3]"
dealer = "shape(north, 4333)"

[[class]]
label = "3 spades, 4432"
expr = "N.L[0] == 3 and N.dist == [4,4,3,2]"
dealer = "spades(north) == 3 && shape(north, any 4432)"

[[class]]
label = "3 spades, 5332"
expr = "N.L[0] == 3 and N.dist == [5,3,3,2]"
dealer = "spades(north) == 3 && shape(north, any 5332)"

[[class]]
label = "4 spades, 4432"
expr = "N.L[0] == 4 and N.dist == [4,4,3,2]"
dealer = "spades(north) == 4 && shape(north, any 4432)"

[[class]]
label = "2 spades"
expr = "N.L[0] == 2"
dealer = "spades(north) == 2"
