# Self A/B of the conventions BBA does not play, or that no PBS card
# switches on (Rick, 2026-10-05): the same deals with the convention off
# (base) and on (variant), judged by the errors yardstick.
#
#   probes/tools/self_ab.py --batch probes/self-ab.toml [--only a,b] [--side ns]
#
# `--side ns` plays the variant for North-South alone (compare --ns-set):
# the opponents keep the base card. Results: each module's notes,
# "Self A/B".

