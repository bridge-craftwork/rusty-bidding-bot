# What Rusty played the Brill dailies with, and when it changed: the
# markers on the Brill dashboard (web/brill.html), read by
# probes/tools/brill_dd_data.py. Add an entry with every deployment of
# rusty-seat-service (or of BEN, which plays Rusty's cards).
#
# `date` is the first daily played on the new version: the day of the
# deploy when it went out in the Pacific morning, the next day when it
# went out in the evening (the dailies' date is Danish). The droplet
# kept no deploy log before 2026-11-27 and pulls `:main` by hand, so the dates come from
# the evidence named in `evidence`: rusty-seat-service's tag messages
# ("live A to B"), its CLAUDE.md, the merge time of the pin, and
# bridge-craftwork-platform's compose file. `confidence` is "stated"
# (a tag or note says so) or "inferred" (from a merge time; the deploy
# itself is not recorded).
#
# kind = "bidding": a new engine, pack or card (rusty-seat-service);
# kind = "play": BEN, the card player.

[[deployment]]
date = "2026-10-08"
kind = "play"
label = "BEN 0.8.7.7"
what = "BEN 0.8.7.7 at the start (OOM-killed three times that day)"
evidence = "rusty-seat-service CLAUDE.md, 'BEN memory incident (2026-10-08)'; image ghcr.io/lorserker/ben-play:0.8.7.7 still on the droplet"
confidence = "stated"

[[deployment]]
date = "2026-10-09"
kind = "play"
label = "BEN 0.8.8.7"
what = "BEN 0.8.7.7 -> 0.8.8.7 with memory limits, after three OOM kills"
evidence = "droplet: container bridge-craftwork-ben-1 created 2026-10-09 00:39 UTC from ben-play:0.8.8.7 and up since (checked 2026-11-27); platform #30 (43bc2ad)"
confidence = "stated"

