[[conv]]
name      = "minor-suit-transfers"
tile      = "bidding_conventions/minor_suit_transfers"
scenarios = ["Minor_Suit_Transfer", "2N_and_1_Minor"]
# The 1NT transfers are BBA's "1N-2S/2N/3C transfer" keys
# (`notrump.transfers.*`); `minor_transfers` is derived from them on
# import and already reads `none` on 21GF-MSTandMSS, so it alone left
# both engines playing them.
off       = ["notrump.minor_transfers=none", "notrump.transfers.two_s_clubs=false", "notrump.transfers.two_nt_clubs=false", "notrump.transfers.two_nt_diamonds=false", "notrump.transfers.three_c_diamonds=false", "notrump.two_nt.minor_transfers=false"]

