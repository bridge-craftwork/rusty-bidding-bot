# The convention score of the conventions BBA plays (Rick, 2026-10-07):
# the same deals bid by BBA and by us with North-South playing the
# convention (the scenario's card) and not (`off`), East-West unchanged;
# Rusty's gain minus BBA's gain on the boards where either auction
# changed, by the errors yardstick.
#
#   probes/tools/conv_ab.py [--only a,b] [--reuse]      # .rbb-cache/conv-ab
#
# Per convention: `tile` (the status page tile it scores), `scenarios`
# (those of the tile whose NS card plays it; others are skipped with a
# note), `off` (the card changes that switch it off, for BBA through the
# exported .bbsa and for us through the same card), optional `on`
# (changes both runs share) and `skip` (why it is not measured this
# way: the tile keeps its scenario score, "background (not isolated)").

# ── Constructive ─────────────────────────────────────────────────────

[[conv]]
name      = "bergen"
tile      = "bidding_conventions/bergen_raises"
scenarios = ["Bergen_Raises"]
off       = ["major_openings.bergen_raises.play=false"]

