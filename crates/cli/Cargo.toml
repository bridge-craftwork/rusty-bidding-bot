[package]
name = "rbb-cli"
description = "Command-line bidding and corpus scoring for rusty-bidding-bot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rbb"
path = "src/main.rs"

[dependencies]
bridge-card.workspace = true
bidspec.workspace = true
rbb-engine.workspace = true
rbb-compare.workspace = true
bridge-types.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
