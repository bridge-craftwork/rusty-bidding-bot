[package]
name = "rbb-assets"
description = "The rule files (conventions/*.bid) and stock .bbsa cards, compiled into the binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

# Data only, so the convention layer's independence from the engine is
# untouched (this crate holds text, the engine compiles it). bridge-card, also
# convention layer, supplies the standard card vocabulary's text.
[dependencies]
bridge-card.workspace = true
