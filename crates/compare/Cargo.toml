[package]
name = "rbb-compare"
description = "Compare rusty-bidding-bot's auctions with reference auctions (BBA, GIB)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rbb-engine.workspace = true
bidspec.workspace = true
bridge-card.workspace = true
bridge-types.workspace = true
bridge-encodings = { git = "https://github.com/bridge-craftwork/bridge-encodings" }
bridge-solver = { git = "https://github.com/bridge-craftwork/bridge-solver" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
