name: CI

# Two kinds of change, two kinds of check (Rick, 2026-09-30: rules and
# engine will be separate repositories; a rules-only change should not
# build the engine):
#
# - rules only (conventions/, docs/SKILLS.md): the rbb binary built on
#   main checks and tests the rules - every .test file, since a change to
#   one module can change another's calls - in about a minute;
# - engine (crates/, Cargo.*, cards/, web/, scripts/, the workflows): one
#   optimised build, then the whole test suite, the WASM package and the
#   web site.
#
# Pushes to main always run the engine checks, and leave the rbb binary
# (artifact rbb-linux) for rules-only pull requests to use. Linux only:
# the full Linux / macOS / Windows matrix runs before a release
# (release.yml).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      rules: ${{ steps.filter.outputs.rules }}
      workbench: ${{ steps.filter.outputs.workbench }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'cards/**'
              - 'web/**'
              - 'scripts/**'
              - '.github/**'
            rules:
              - 'conventions/**'
              - 'docs/SKILLS.md'
            workbench:
              - 'crates/workbench/**'
              - 'Cargo.lock'
            web:
              - 'web/**'
              - 'crates/wasm/**'
              - '.github/workflows/**'

  rules:
    name: Rules (rbb from main)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rules == 'true' && needs.changes.outputs.engine != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The binary from the latest successful run on main; built here if
      # there is none (a first run, or the artifact expired).
      - name: rbb from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
                 --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$id" ] && gh run download "$id" --repo "$GITHUB_REPOSITORY" --name rbb-linux --dir bin; then
            chmod +x bin/rbb
          else
            echo "no rbb artifact on main: building one"
            cargo build --locked --release -p rbb-cli
            mkdir -p bin && cp target/release/rbb bin/rbb
          fi
          bin/rbb --version
      - name: Rule files
        run: bin/rbb bid check
      - name: Every .test file
        run: bin/rbb bid test
      - name: docs/SKILLS.md is current
        run: |
          bin/rbb bid skills --doc docs/SKILLS.md
          git diff --exit-code docs/SKILLS.md

  engine:
    name: Engine (build and tests)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The git dependencies (bridge-types, bridge-encodings, bridge-solver,
      # bridge-card) are public and pinned by the committed Cargo.lock;
      # --locked fails rather than re-resolve. No local [patch] exists here
      # (that pattern lives in a gitignored .cargo/config.toml).
      - name: Build rbb
        run: cargo build --locked --release -p rbb-cli
      - name: Rule files
        run: target/release/rbb bid check
      # Optimised: the tests bid thousands of positions, which a debug
      # build runs several times slower than it compiles.
      # The workbench (a GUI: egui and its graphics stack) is most of the
      # compile time (273 s optimised, cold); its tests run only when it
      # changes, on pull requests and on main alike.
      - name: Tests
        run: cargo test --locked --workspace --release --exclude rbb-workbench
      - name: Workbench tests
        if: needs.changes.outputs.workbench == 'true'
        run: cargo test --locked --release -p rbb-workbench
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: rbb-linux
          path: target/release/rbb
          retention-days: 90

  wasm:
    name: WASM package
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build
        run: crates/wasm/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rbb-wasm-pkg
          path: crates/wasm/pkg

  # The web site (native/WASM determinism, reference.txt drift): on
  # main, and on pull requests that touch the site or the WASM crate.
  web:
    name: Web site
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: jetli/wasm-pack-action with `latest` falls back to v0.9.1
      # when its API lookup fails (bridge-craftwork-site PLAN.md, Phase 3).
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'
      - name: Build the site (engine, dealer3, reference.txt)
        run: web/build.sh
      - name: Tool contract tests (run, validate, getInput, dealer3)
        run: node web/scripts/test.mjs web/dist
      # reference.txt drift: its conventions are what the .bid files in the
      # tree say (native `rbb bid reference`), it is what the shipped engine
      # and the page's vocabulary write, and it names every input field,
      # parameter, API method, card and module.
      - name: reference.txt drift check
        run: |
          cargo run --locked -q -p rbb-cli -- bid reference -o native-reference.txt
          node web/scripts/check-reference.mjs web/dist native-reference.txt
      # Determinism (R4): the WASM engine bids 300 random deals exactly as
      # the native rbb does (calls, meanings, what each call showed).
      - name: Native and WASM bid the same
        run: |
          node web/scripts/determinism.mjs deals det-deals.pbn 300
          cargo run --locked -q -p rbb-cli -- bid-pbn -i det-deals.pbn -o det-native.pbn \
            --ns-card 21GF-DEFAULT --ew-card 21GF-GIB --all-meanings
          node web/scripts/determinism.mjs check web/dist det-native.pbn
      - name: The output is complete
        run: |
          for f in index.html 404.html _headers reference.txt app.js pkg/rbb_wasm_bg.wasm dealer3/dealer3_wasm_bg.wasm; do
            test -s "web/dist/$f" || { echo "missing web/dist/$f" >&2; exit 1; }
          done
          grep -q '^/reference.txt' web/dist/_headers
          du -sh web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: rbb-web-dist
          path: web/dist
