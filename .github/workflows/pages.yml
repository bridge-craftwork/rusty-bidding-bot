name: Pages

# Builds the showcase (web/, docs/WEB.md) and deploys it to the Cloudflare
# Pages project `rusty-bidding-bot`, which bridge-craftwork.com mounts at
# /rusty-bidding-bot/. Modelled on dealer3's pages.yml.

on:
  push:
    branches: [main]
    paths:
      # The site embeds the engine and the rules, so a change to either is a
      # change to the site: globs, so a new crate cannot be forgotten.
      - 'crates/**'
      - 'conventions/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'wrangler.jsonc'
      - '.github/workflows/pages.yml'
  # Redeploy without a code change.
  workflow_dispatch:

permissions:
  contents: read

# Latest wins: a superseded deploy has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Named for what it can do (Account -> Cloudflare Pages -> Edit), so other
  # Cloudflare tokens can sit beside it; wrangler reads CLOUDFLARE_API_TOKEN.
  # Read here rather than in a step so a step's `if` can test it.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: jetli/wasm-pack-action with `latest` falls back to v0.9.1
      # when its API lookup fails (bridge-craftwork-site PLAN.md, Phase 3).
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      # The same build and checks as ci.yml's "Web site" job: nothing is
      # deployed that CI would have failed.
      - name: Build the site (engine, dealer3, reference.txt)
        run: web/build.sh
      - name: Tool contract tests
        run: node web/scripts/test.mjs web/dist
      - name: reference.txt drift check
        run: |
          cargo run --locked -q -p rbb-cli -- bid reference -o native-reference.txt
          node web/scripts/check-reference.mjs web/dist native-reference.txt
      - name: The output is complete
        run: |
          for f in index.html 404.html _headers reference.txt app.js pkg/rbb_wasm_bg.wasm dealer3/dealer3_wasm_bg.wasm; do
            test -s "web/dist/$f" || { echo "missing web/dist/$f" >&2; exit 1; }
          done
          du -sh web/dist

      - name: Skip without the Cloudflare credential
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::notice::CLOUDFLARE_PAGES_DEPLOY_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: site built and checked, not deployed."
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 pages deploy --commit-dirty=true
